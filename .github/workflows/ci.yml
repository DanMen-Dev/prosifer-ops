name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prosifer
          POSTGRES_USER: prosifer
          POSTGRES_PASSWORD: prosifer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prosifer -d prosifer"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql+psycopg://prosifer:prosifer@localhost:5432/prosifer
      PROSIFER_API_KEY: clave-de-prueba
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
